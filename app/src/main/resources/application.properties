spring.application.name=smart-clinic
server.port=8080
spring.datasource.url=${CLINIC_DB_URL:jdbc:mysql://localhost:3306/cms}
spring.datasource.username=${CLINIC_DB_USER:clinic}
spring.datasource.password=${CLINIC_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.data.mongodb.uri=${CLINIC_MONGO_URI:mongodb://localhost:27017/prescriptions}
jwt.secret=${CLINIC_JWT_SECRET}
clinic.seed=${CLINIC_SEED:false}
clinic.demo-password=${CLINIC_DEMO_PASSWORD:DemoPassword1!}
spring.thymeleaf.cache=false
server.error.include-message=never
server.error.include-stacktrace=never
