name: Java clinic checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Compile and test
        run: mvn -B -f app/pom.xml verify
      - name: Build container
        run: docker build -t smart-clinic:ci .
